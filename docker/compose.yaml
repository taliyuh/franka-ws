services:
  franka_ros:
    build:
      context: .
      dockerfile: Dockerfile
    image: franka_ros:noetic
    container_name: franka_ros
    # Required/strongly recommended for Franka FCI
    network_mode: host
    ipc: host
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      # NVIDIA support
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # ROS
      ROS_DISTRO: noetic
      ROSCONSOLE_STDOUT_LINE_BUFFERED: "1"
      # Workspace build defaults (Release, which packages); see the file.
      COLCON_DEFAULTS_FILE: /franka_ws/colcon_defaults.yaml
    volumes:
      # Workspace root
      - ../:/franka_ws
      # X11 / RViz
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Hardware devices (Azure Kinect and Femto Bolt over USB)
      - /dev:/dev:rw
    devices:
      - /dev/dri:/dev/dri
    # Real-time capabilities for libfranka / franka_control (1 kHz loop)
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      rttime:
        soft: -1
        hard: -1
      memlock:
        soft: -1
        hard: -1
    stdin_open: true
    tty: true
    working_dir: /franka_ws
    command: /bin/bash
