# Board-relative pen probing. All linear units are metres and radians are used
# for rotations. The paper grid need not be configured: command its coordinates
# directly through --offset X Y Z in the board frame.
probe:
  # Leave null so the approach pose is derived from the board plane. A fixed
  # base-frame Z is accepted only if it leaves the physical pen tip at least
  # approach_height_m above the board.
  staging_z_m: null
  # Clearance from the board plane for the approach pose.
  approach_height_m: 0.02
  # Fast, safe repositioning in X/Y at the current/safe staging height.
  approach_speed_scale: 0.50
  # Ten-times-faster descent profile: larger guarded steps avoid paying the
  # controller's 2 s minimum trajectory duration for every millimetre.
  descent_speed_scale: 0.60
  descent_segment_m: 0.003
  # Do not command below the requested pen-tip target plane. If the pen does
  # not touch by this limit, remeasure pen_tip_offset_tcp_m rather than probing
  # farther into the board.
  max_descent_m: 0.15

  # Orientation of panda_hand_tcp relative to the board frame. This default makes
  # TCP +Z point toward board -Z. `pipeline check/probe` replace it per hole: the
  # held peg is turned to the hole's yaw, by the multiple of its symmetry period
  # that turns joint 7 least while keeping it off its limits (pipeline grasp.py
  # choose_turn). This value only matters for a plain probe_board run.
  # Yaw -90 deg kept joint 7 mid-range at the board; yaw 0 needed j7 = -2.85
  # rad against its -2.897 limit (joint_motion_generator_position_limits_violation).
  tcp_orientation_board_rpy: [3.141592653589793, 0.0, -1.5707963267948966]


  # Vector from panda_hand_tcp origin to the tool tip, expressed in TCP axes; the
  # tip, not the TCP origin, is placed on the requested board coordinate. This
  # default is the old 12.5 cm pen coaxial with TCP +Z. With the printed V-block
  # fingers the pegs sit off-axis: `pipeline check/probe` replace this with the
  # held peg's tip from pipeline/config/grasps.yaml (sessions/<name>/targets/
  # <hole>_tool.yaml), so it only applies to probe_board run by hand.
  pen_tip_offset_tcp_m: [0.0, 0.0, 0.125]
