# Pipeline settings.
#
# `pipeline new` copies this file into the new session as <session>/config.yaml
# and every later command reads THAT copy, so a session always records the
# settings it was produced with. Edit this file to change the defaults for new
# sessions; edit <session>/config.yaml to change one session.
#
# The workspace is the folder containing pipeline/ (found automatically).
# Relative paths below are relative to the workspace; ~ is expanded.

paths:
  sessions: sessions                         # must be inside the workspace
  # pose-refinement checkout with its .venv; default: next to the workspace.
  # The environment variable PIPELINE_POSE_REFINEMENT overrides this.
  pose_refinement: ../pose-refinement

docker:
  container: franka_ros                      # see docker/compose.yaml
  workspace: /franka_ws

robot:
  ip: 192.168.1.1
  # Frames, trajectory action and motion limits used by every capture tool.
  config: src/panda_calibration/config/calibration_hardware.yaml
  # Probe tool: pen-tip offset, approach height, descent limits.
  manipulation_config: src/panda_calibration/config/board_manipulation.yaml

holes: pipeline/config/holes.yaml
# Where each peg sits in the printed V-block fingers (franka_fr3_fingers v2);
# check/probe place the held peg, of the hole's shape, on the hole.
grasps: pipeline/config/grasps.yaml

# ---------------------------------------------------------------- eye in hand
# Azure Kinect rigidly mounted on the wrist housing (panda_link6, NOT joint 7).
# The board itself is the calibration target. Launch the camera with
# `roslaunch panda_calibration azure_4k.launch`.
eye_in_hand:
  camera: azure
  namespace: /azure_camera
  cameras_config: src/panda_calibration/config/cameras_azure.yaml
  # Rough T_link6_camera used to plan the calibration views (from the
  # AprilTag eye-in-hand solve of 2026-10-12 on the FR3; link6 is the same
  # frame on the Panda, so it holds if the camera bracket is mounted the same
  # way). Needs to be within ~1 cm.
  prior_handeye: pipeline/config/azure_prior_handeye.json
  look_pose: pipeline/config/azure_look_pose.yaml
  speed_scale: 0.3
  # Multiplies the capture tool's wait for a fresh frame (10 s) and its motion
  # timeouts; >1 tolerates a camera stream that stalls for a few seconds.
  timeout_scale: 3.0
  max_mad_px: 1.0            # reject board fits with a worse median rim residual
  # Calibrated outside the pipeline on 2026-11-19. `calibrate` keeps these fixed;
  # `calibrate --fit-intrinsics` / `--fit-joint-offsets` estimate them from the board
  # views instead (the old behaviour). Sessions copy them into their config.yaml.
  base_calibration:
    # Azure colour camera, AprilGrid (pipeline/tools/calibrate_azure_intrinsics.py):
    # fx fy cx cy refined, distortion kept at factory, 0.78 px RMS over 38 views.
    intrinsics_source: camera_calibration/azure_2026-11-19_114622/intrinsics.json
    intrinsics:
      fx: 1848.9176873870458
      fy: 1850.2389730721593
      cx: 1921.5632329184084
      cy: 1098.5255429628123
      k1: 0.32419127225875854
      k2: -2.520479679107666
      p1: 0.00035915308399125934
      p2: -0.00024095129629131407
      k3: 1.5407172441482544
      k4: 0.20744043588638306
      k5: -2.3417866230010986
      k6: 1.462856650352478
    # Joint encoder offsets, true angle = reading + offset (pipeline/tools/joint_offsets:
    # AprilGrid views + pen touches). J6 is uncertain (+-4 mrad); J1 and J7 are not observable.
    joint_offsets_source: kinematic_calibration/2026-11-19_140123/joint_offsets.json
    joint_offsets_rad:
      panda_joint1: 0.0
      panda_joint2: -0.002435263123034892
      panda_joint3: 0.004534366003008772
      panda_joint4: -0.0036185904484644766
      panda_joint5: 0.007162572564426816
      panda_joint6: -0.008341526338093718
      panda_joint7: 0.0
  calibrate:
    views: 30
    # Extra views from the robot's side of the board (camera between the base and
    # the board, looking away from the robot), visited from READY before the
    # look pose: the views above all look back toward the base. 0 turns them off.
    robot_side_views: 4
    bundle_free: [fx, fy, cx, cy]     # refined by bundle adjustment, only with --fit-intrinsics
    # Chain error terms (quoted: YAML reads off as false), see eye_in_hand.chain_model.
    # "off" is fitted only with --fit-joint-offsets. scale and sag are off by default
    # (2026-11-19: intrinsics and joint offsets come from base_calibration); add them
    # back as "scale", "sag" to fit the camera distance scale and the mount sag.
    model: ["off"]
  locate:
    views: 8
    max_view_spread_mm: 1.5           # views disagreeing more than this are dropped
  plan:                               # view generation, see eye_in_hand.plan_views
    min_dist: 0.40
    max_dist: 0.62
    max_tilt_deg: 35.0
    max_roll_deg: 45.0                # camera roll about its axis, around the look pose roll
    clearance: 0.125                  # link origins above the board top, m
    limit_margin: 0.15                # rad from each joint limit
    image_margin: 120.0               # px
    max_step_deg: 45.0
    box_deg: 35.0                     # confine joints 1-6 to +-this around the look pose (needed: wider gives unreachable views)
    seed: 20261012

# ----------------------------------------------------------------- stationary
# Femto Mega + Femto Bolt fixed in the cell, ArUco tag on the gripper. Launch
# the cameras with `roslaunch panda_calibration orbbec_4k.launch`.
stationary:
  cameras:                    # name: topic namespace
    mega: /mega_camera
    bolt: /wrist_camera
  reference_camera: mega
  cameras_config: src/panda_calibration/config/cameras_mega_bolt.yaml
  calibration_poses: pipeline/config/stationary_calibration_poses.txt
  speed_scale: 0.2
  # Accepted board-rig calibration (pose-refinement calibrate_stationary_rig.py),
  # used with two cameras for its validated per-camera rim-bias terms.
  # null fits without it.
  rig_calibration: null

# --------------------------------------------------------------------- insert
# `pipeline insert --hole H`: the probe's approach to start_height_mm above the hole (ROS), then up to `attempts`
# runs of the tilt search (rl_manip robot_session peg_search tilt-slide, libfranka) with the ROS trajectory
# controller stopped, each aimed at the best belief of the hole so far; inserted: open the hand, lift lift_m.
# Sessions created before 2026-11-21 have no insert section: they use this template's.
insert:
  robot_session: ../rl_manip/robot_session   # docker-compose.yml + build/peg_search (built in its container)
  robot_ip: 172.16.0.2                       # FCI address, as robot_session's ROBOT
  # The robot takes one FCI client: insert stops robot.launch before peg_search (2026-11-21: peg_search connecting
  # killed franka_control) and starts it again afterwards, in the background (log in <workspace>/log/robot_launch/).
  # moveit:=false load_gripper:=false skips unused nodes (probe_board uses local IK, peg_search/gripper drive the hand).
  robot_launch: roslaunch panda_calibration robot.launch robot_ip:=172.16.0.2 moveit:=false load_gripper:=false
  robot_launch_match: roslaunch panda_calibration robot.launch   # pkill -f pattern of a running one
  # Travel between holes: libfranka (peg_search move, zero ROS handovers during campaign) or ros (probe_board).
  travel: libfranka
  # Keep one robot_session container running (docker exec) instead of docker compose run --rm per call.
  persistent_container: true
  # Peak speeds for free-air joint moves (lift, move, extract/peck transitions); contact speeds stay unchanged.
  free_move_speed_m_s: 0.12
  free_joint_speed_rad_s: 0.7
  # Holes with at least this clearance: the peck search (peg_search peck, one run) instead of the tilt search
  # attempts. Robot 2026-11-21, hexagon_c3mm near the base (arm folded): the tilt search's Cartesian impedance lagged
  # 3-11 mm in z and 2 deg in tilt in free air, libfranka's internal joint position controller 0.2-0.6 mm. Peck: over
  # each point of a hexagonal grid (nearest the vision hole first) 6 mm above the vision board, peg upright, straight
  # down at 3 mm/s until contact (the force estimate's fast change, or the tip held back 1 mm) or the tip
  # peck_insert_depth_m below the board (inserted). Spacing 1.7 mm: the tip within 1 mm of the hole axis somewhere
  # (a 3 mm clearance hole takes the aligned peg within 1.5 mm).
  # method: plunge (default): one position-controlled plunge at the vision hole (the peck below, one point). Not in:
  # the board touched touch_offset_m beside the hole along the board's x (between the hole columns): the board height
  # the robot measures there classifies the plunge's contact (on the board, or stuck in the hole mouth: the rectangle
  # 3.4 mm deep on the chamfer, 2026-11-21), and is the plane for up to `attempts` tilt search attempts (no probe);
  # stuck: the first one is a compliant plunge at that spot (the hold presses it in). Before each later attempt the
  # peg is turned upright at the start height (position control). peck: a grid of plunges. tilt: the old attempts.
  method: plunge
  touch_offset_m: 0.022
  # The board height model (board_pipeline/boardheight.py, 2026-11-23): every touch kept in
  # <session>/insert/board_heights.yaml; robot - vision height = a plane over the board + one offset per shape's grasp
  # (9 runs: 0.07 mm RMS; vision 1.1-1.8 mm low, tilted 0.25 deg; the pegs are all one length, but the triangle's tip
  # touched 0.42 mm higher than the L's: held higher, or tilted, in the fingers).
  # board_touches: 3 the local plane; 1 this grasp's height on the model's slope (each run from the others: 0.04 mm
  # RMS, max 0.08, like the 3 touches; saves ~15 s); 0 the model alone (0.12 mm RMS, max 0.25; a shape touched
  # before, and only as good as the grasp repeats);
  # auto: 1 once the model knows the slope (board_height_min_runs runs, touches over board_height_min_span_m in base
  # x and y), else 3. The peck aims at the model's board either way (`pipeline found` shows the model and its check).
  board_height_model: true
  board_touches: 0
  board_height_min_runs: 2
  board_height_min_span_m: 0.04
  peck_min_clearance_mm: 2.0   # (not used: --method / method choose)
  peck_insert_depth_m: 0.010
  # Contact: peg_search's own wrench from the joint torque sensors (O_F_ext_hat_K read 0 while moving and jumped
  # when stopping, 2026-11-21: false contacts pulled the rectangle back out of its hole). Its ~15 N step when a
  # descent starts settles within ~2 mm: hover 5 mm, the check after 3 mm. Held back: 0.6 mm (free air reaches 0.35).
  peck_options: [--peck-spacing, "0.0017", --peck-radius, "0.006", --peck-hover, "0.005", --peck-speed, "0.005",
                 # 7 N: free descents peaked at 5.7 N, real board contacts 10-14 N (logs 2026-11-21); held back:
                 # the tip 0.6 mm above the command beyond its steady offset (contacts 0.64-0.67, free <= 0.35)
                 --peck-contact-force, "7", --peck-free-travel, "0.003", --peck-max-error, "0.0006",
                 --peck-max-points, "60",
                 # the moves between pecks start with the contact's force and the estimate's 10-20 N jump
                 --posture-max-force-change, "45"]
  attempts: 5
  # Found holes and the board correction (board_pipeline/holefit.py, 2026-11-21). Inserted: before the release the
  # peg touches the hole walls in centre_touches directions (peg_search centre: internal joint position controller,
  # 1 mm/s, stop on a 5 N fast force change or the tip 0.3 mm held back; centre_options adds peg_search options),
  # the hole centre fitted to the contacts (else the seated tip) and recorded with the vision position in
  # <session>/insert/found_holes.yaml. board_correction: every insert aims at the hole moved by the rigid board shift
  # fitted to the found holes of the current board pose (`pipeline found` shows it; --no-board-correction).
  board_correction: true
  # The local part (holefit.local_correction): what the rigid shift leaves at the found holes, as a smooth field over
  # the board (Gaussian-process regression, correction_length_m); near a found hole the correction follows it, far
  # from all of them it is the rigid one. The field's amplitude: correction_field_m, null: the scatter the rigid fit
  # leaves beyond the holes' sigmas (0.3 mm with fewer than 4 holes), at most correction_field_cap_m. `pipeline found`
  # shows whether it predicts held-out holes better (leave-one-out). correction_local false: rigid only.
  correction_local: true
  # Found holes of these shapes stay out of the correction (they are still recorded): the L's found position carries
  # its own tip error (2026-11-23: the CAD tip ~1.1 mm off, l_shape_tip_measured.yaml), not the board's.
  correction_exclude_shapes: [l_shape]
  correction_length_m: 0.06
  correction_field_m: null
  correction_field_cap_m: 0.001
  centre_after_insert: true
  # Skip wall touches on tight holes (<= 0.2 mm): the seated tip is already within +-0.015..0.10 mm of the hole
  # centre, and centre_free_travel (0.2 mm) would tare out a wall contact before checking starts.
  centre_min_clearance_mm: 0.5
  # On tight holes (< centre_min_clearance_mm), once the peg is this far below the touched board top it is
  # squarely captured by the bore: releasing the gripper drops it straight to the bottom without arm torque binding.
  # 4 mm since 2026-11-23 (5 before): rectangle_c0p03mm held upright 4.1-4.5 mm below the touched board three times,
  # each taken for a jam and pulled back out; released after an interrupt it dropped in.
  tight_insert_depth_m: 0.004
  centre_touches: 6
  centre_options: []
  # How the tilt search attempts are aimed (board_pipeline/beliefgrid.py, 2026-11-21; --search): grid: a probability
  # grid of the hole (prior: vision, sigma half the error disc) updated from every attempt's 1 kHz log (missed lines,
  # dips, holds, plunges); each attempt's lines (--line-offsets, in order) planned on it, greedily the strip with the
  # most probability, until grid_target of it is covered. belief: the last hold or dip (located search). The spiral
  # keeps belief. grid_p_detect: a line over the hole dips (its miss leaves 1 - this); grid_p_true: a dip, hold or
  # plunge result is right.
  search: grid
  grid_p_detect: 0.8
  grid_p_true: 0.9
  grid_target: 0.95
  grid_max_lines: 15
  # The hole error disc the tilt search is sized for (run-up, slide length, lines; the located radii at most this).
  # 2 mm since 2026-11-21: the holes inserted that day were 0.2-0.9 mm from vision (tilt_leads.yaml's error_m is the
  # simulation's 3 x clearance, 5 mm). null: tilt_leads.yaml's.
  error_m: 0.002
  # Tip above the vision board at the end of the probe's approach. The search's guarded descent finds the real
  # board within approach + 10 mm; approach = height + approach_margin_mm (the vision board's z error).
  start_height_mm: 6.0
  approach_margin_mm: 4.0
  # Later attempts start lifted to their own start height; with the board plane known, approach = that height
  # above the plane + this.
  approach_known_margin_mm: 1.5
  # Attempt 1 first goes straight down over the hole (compliant, peg_search) until it feels contact: the tip
  # 15 mm below the vision board is inserted; a contact plunge_in_depth_mm or more below it is the peg in the
  # hole mouth (the hold presses it in); higher is the board: back up to the start height and search.
  plunge: true
  plunge_in_depth_mm: 3.0
  # Base-frame slide direction preferred among a shape's equivalent leads (2026-11-12: tilting about base y,
  # i.e. sliding along base x, vibrated the wrist at ~45 Hz; base +y worked).
  slide_dir_base_deg: 90.0
  # Lead group per shape (tilt_leads.yaml group; none: the simulation's order, group 0 first). The L-shape: group 0
  # the long arm's end corner (corner@225, 14 mm from the centroid, 8.3 mm beside the tip's line; the simulation's
  # best at 3 / 1 mm, 0.75 / 0.69), group 1 the outer elbow corner (corner@45, 12 mm out, 3.7 mm beside; 0.69 /
  # 0.38). Robot 2026-11-23: group 0 never dipped in 11 slides over l_shape_c1mm / c0p03mm, though (with the
  # measured tip, l_shape_tip_measured.yaml) it ran 8-9 mm over the hole each time: that corner is ~28 mm from where
  # the fingers hold the L (pressing it turns the L in them?); the elbow is ~15 mm from them.
  lead_group: {l_shape: 1}
  # Search pattern for every shape: lines (robot-tested, hexagon 2026-11-21) or spiral (the simulation's choice
  # for hexagon, triangle, rectangle: config/tilt_leads.yaml, not yet working on the robot). null: tilt_leads.yaml's.
  pattern: lines
  # Line spacing caps (m) on tilt_leads.yaml's (0.7 x the effective dip band, at most 5 mm). Flat leads (round,
  # hexagon): the robot-tested hexagon run used 1 mm, and a flat's band shrinks with the peg's yaw error. Corner leads
  # (triangle, rectangle, L-shape; null: no cap): a vertex dips anywhere over the hole whatever the yaw, its band is
  # 11-25 mm wide (2026-11-21: until then the 1 mm cap applied to every lead, 11 lines for the 5 mm disc). Lines:
  # 1 + 2k, line k covering half a spacing either side of k x spacing, out to the hole error, centred on the dip band.
  max_line_spacing_m: 0.001
  max_corner_line_spacing_m: null
  # Belief after an attempt that did not insert (the next one starts with the located search about it):
  # a hold (the peg upright in the hole mouth: the tip on the hole axis) searches located_radius_m about it;
  # a dip only (the lead over the hole near its rim) dip_radius_m about the lead + peg radius along the slide.
  located_radius_m: 0.002
  # A hold that jammed (the peg wedged in the hole mouth, not on its axis; robot 2026-11-21, triangle_c1mm: 2.02 mm
  # from the hole): this radius about it instead.
  jam_radius_m: 0.003
  # A dip: the hole centre from the dip region (tilt_leads.yaml along_m, band_m), at least this radius, wider across
  # the slide by the dip band (within the searched disc).
  dip_radius_m: 0.0035
  # tilt-slide --board-ref-travel (2026-11-23): the slide's first part where the lead is on the board for certain
  # (run-up - near rim - error disc - board_ref_margin_m, at most board_ref_travel_max_m): the board's height follows
  # the lead there and a stall is stiction, not the hole. L-shape 0.2 / 0.03 mm that day: the lead read 0.04-0.08 mm
  # below the touched plane once sliding, the start's stiction stall became an upright 21 mm from the hole. 0: off
  # (peg_search built before 2026-11-23 does not know the option).
  board_ref_travel_max_m: 0.002
  board_ref_margin_m: 0.001
  # Board probe (4 points 25 mm about the hole) on the first attempt; later attempts reuse its plane.
  probe_points: 4
  probe_radius_m: 0.025
  # peg_search options common to every attempt (robot_session README 4b-2/4b-3; the hexagon run of 2026-11-21).
  peg_search_options: [--force-sign, "-1", --tilt-deg, "4", --lift-tolerance, "0.002",
                       --stiffness, "3000", "3000", "2000", "200", "200", "30", --contact-force, "6",
                       --wiggle-amp-deg, "0.25",
                       # The force estimate read 5.9-13 N on a free tip after the hand over (2026-11-21): the posture
                       # move's 5 N start check refused; its tracking and force-change checks still guard it.
                       --posture-max-force, "15",
                       # Its force-change backstop: the estimate drifted 15.01 N in a free 20 mm lift (2026-11-21, twice;
                       # POSTURE_FINDINGS 5-14 N); the 1.5 mm tip-tracking check is the contact guard.
                       --posture-max-force-change, "25",
                       # A posture move that cannot be planned (near the base, joint 2 at 15 deg) is skipped.
                       --posture-fallback,
                       # A run after a failed one may start ~26 mm above the board; inserted is 15 mm below it.
                       --max-descent, "0.05",
                       # the tare's limit on the torque-sensor wrench at rest (the load model's error)
                       --max-bias, "15"]
  # probe_board for insert: one 20 mm descent move and this settle tolerance (not 3 mm steps to 0.2 mm, ~36 s).
  probe_tolerance_m: 0.001
  probe_tolerance_rad: 0.005
  # Payload beyond Desk's Franka Hand for peg_search, split into:
  #   - flange frame (rotates with joint 7): printed V-block fingers + peg
  #   - panda_link6 frame (does NOT rotate with joint 7): Azure Kinect DK + mounting bracket
  # peg_search transforms the link6 payload into the flange frame at the robot's current q7 before calling setLoad.
  # Total mass = 0.68 kg; validated on 2026-11-21 free-air telemetry (cut residual wrist torque by 60-85 %).
  load_mass_kg: 0.13
  load_com_m: [0.0, 0.0, 0.08]
  link6_load_mass_kg: 0.55
  link6_load_com_m: [-0.018, 0.013, 0.077]
  release_width_mm: 30.0
  # peg_search lift's force-change backstop (the torque-sensor wrench steps ~15-20 N when a move starts; 25 N stopped
  # the 15 cm lifts after the rectangle and L-shape releases, 2026-11-21). The tip-tracking check guards contact.
  lift_max_force_change: 50
  # A touched board this far from vision's is a false contact: vision's is used instead.
  board_max_off_m: 0.003
  # peg_search lift (libfranka joint position controller, 10 mm/s) after the release, after a run that did not insert
  # (with the peg) and after a failed extract. 6 cm (15 until 2026-11-23): the lowest point then clears every peg
  # standing in a hole (they stick out ~28 mm, up to ~46 if not fully in): released, the fingertips go from ~8 mm
  # over the board (fingers README: the peg 22 mm in) to ~68; with the peg, its tip from the start height (6 mm) to ~66.
  lift_m: 0.06
  # Travel heights (2026-11-23), the peg tip (empty hand: where it would be) above the vision board at the hole, so
  # that extract and insert hand over at the same height: the pegs standing in holes stick out ~28 mm (~46 if not
  # fully in). peg_travel_mm, with a peg: where extract ends and insert's probe approach starts (the approach pose
  # there, then straight down to start_height_mm), and where a run that did not insert goes with its peg.
  # hand_travel_mm, empty: where insert goes after the release and where extract's approach starts (the fingertips
  # ~30 mm above the tip). null: lift_m and the probe's own 20 mm clearance as before.
  peg_travel_mm: 55.0
  hand_travel_mm: 40.0
  # After a failed attempt the tip goes straight back to start_height_mm above the vision board (peg_search lift, up
  # or down), so every descent starts low: the free-air friction lag grows with its length (2026-11-21).

# pipeline extract (board_pipeline/extract.py, 2026-11-23): pull a peg out of a hole with the empty hand
# (rl_manip robot_session peg_search extract). The fingers' README: the roof on the peg top (3-5 N) sets the grasp
# height, then grasp(seat width, 0.02 m/s, 30-40 N); the V seats the peg in x, y and yaw. The peg is held by its
# hole, so the hand must fit the peg: a Cartesian impedance at the peg tip, stiff in z (the grasp height), soft in
# x, y and yaw (the fingers pull the hand onto the peg) and moderately soft in tilt (the hand lines up with the hole
# axis on the pull, 0.03 mm holes bind otherwise).
extract:
  approach_height_mm: 40.0   # probe_board over the hole, without insert.hand_travel_mm (which replaces it)
  hover_mm: 6.0              # the compliant descent starts this far above the expected peg tip (release, else board)
  max_depth_mm: 24.0         # no peg top felt with the tip this far below the board: fail (the pocket is ~22 mm)
  open_margin_mm: 7.0        # each finger off the peg during the descent (seat width + 2 x this; 7 mm gives +-4.1 mm x-clearance in the 60 deg V for leaning pegs while keeping >= 80 mm2 roof overlap)
  # N/m x y z, Nm/rad roll pitch yaw (base axes, at the tip). descent_stiffness until the roof is on the peg (robot
  # 2026-11-23: soft from the start, the empty hand drifted 6 mm and 0.8 deg in free air in 2 s: the model's ~2 N
  # error); stiffness from the grasp on, plus the stiff spring's mean wrench during the press held as a feed-forward.
  descent_stiffness: [3000, 3000, 4000, 200, 200, 20]
  stiffness: [300, 300, 4000, 20, 20, 2]
  # The pull (robot 2026-11-23, hexagon): with the grasp's 20 Nm/rad tilt the hand pitched 0.6-1.9 deg on the way up
  # and jammed the peg in the 0.03 mm hole (15 N, stick-slip). It keeps the orientation the peg had seated deep in the
  # hole (the hole's axis, tilt 200 Nm/rad), rises along that axis, and wiggles the tilt as the tilt search does while
  # the tip lags wiggle_lag_mm. Lagging pull_max_lag_mm the target stops (that ~16 N pull held, wiggling) until the
  # tip catches up; no progress for stuck_time_s: stuck.
  pull_stiffness: [150, 150, 4000, 70, 70, 2]
  wiggle_deg: 0.15
  wiggle_hz: 2.0
  wiggle_lag_mm: 1.5
  stuck_time_s: 4.0
  speed_mm_s: 5.0
  # The roof on the peg top: the tip held back 1 mm behind the descent (every real touch, 2026-11-23); the z force's
  # change faster than its 0.25 s mean only as a backstop (4 N: a free-air blip was taken for the peg, 22 mm up).
  contact_force_n: 15.0
  press_n: 3.0               # down on the peg top while the fingers close
  pull_speed_mm_s: 6.0
  pull_max_lag_mm: 5.5       # the tip this far behind the pull (~22 N at 4000 N/m): target clamps until peg moves
  clear_mm: 5.0              # the tip this far above the board: out
  # After the pull (the tip clear_mm above the board): up this far more, so the held peg's tip is ~a peg length
  # (50 mm) over the board, above any peg standing in a hole (they stick out ~28 mm, more if not fully in), for the
  # probe's move to the next hole. 10 cm until 2026-11-23. Only without insert.peg_travel_mm (which replaces it).
  lift_m: 0.045
  # A failed extract with the peg still in its hole: hand open, up to retry_above_hover_mm over the hover, and up to
  # `retries` more attempts in place (aimed where the fingers seated on the peg, if they got that far).
  retries: 3
  retry_above_hover_mm: 5.0
  grasp_force_n: 45.0
  grasp_eps_inner_mm: 3.0    # accepted narrower than the seat width (pegs sit deeper in the printed V: `grasp`)
  grasp_eps_outer_mm: 1.0
  # Empty: both rectangle and L match the normal (unmirrored) CAD seat in insert and extract (2026-11-24).
  mirrored_shapes: []
  options: [--max-tip-speed, "0.12"]  # allow brief stick-slip breakaway (>50 mm/s) on 0.03 mm holes without aborting

# pipeline campaign (board_pipeline/campaign.py): full-board rounds, unattended. Each peg starts in its
# start_clearance hole; each round goes row-wise through `clearances` across all shapes (extract, insert); a peg that
# does not go in is parked in its park_clearance hole (without wall-touching/recording) and taken from there for the
# next clearance. XY hole corrections (`found_holes.yaml`) are kept within a round and archived/reset between rounds.
campaign:
  rounds: 20
  shapes: [round, hexagon, triangle, rectangle, l_shape]
  clearances: [c3mm, c1mm, c0p2mm]
  start_clearance: c0p2mm
  park_clearance: c3mm
  # stop (default): any extract failure stops the campaign (2026-11-23: skip_shape went through three shapes with the
  # same systematic failure). skip_shape: a peg left in its hole blocks only its shape.
  on_extract_failure: stop
  # Holes inserted with --no-board-correction during campaigns (e.g. temporary workaround).
  no_board_correction_holes: [l_shape_c3mm]
