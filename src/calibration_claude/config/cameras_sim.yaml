# Ground-truth camera extrinsics/intrinsics for the Gazebo rehearsal scene.
#
# Values transcribed from
#   franka_gazebo_bringup/worlds/fr3_dual_camera_calibration.sdf
# `body_xyz`/`body_rpy` are the *model* poses exactly as they appear in the SDF
# (Gazebo camera bodies look down +X).  calibration_claude applies the
# body->optical rotation itself, so do not pre-rotate them here.
#
# NOTE: the static_transform_publisher nodes in fr3_dual_camera_calibration.launch.py
# publish these body poses but name the child frames `*_color_optical_frame`.  Those
# TFs are therefore rotated ~90/90 deg away from the true optical frames; this file
# is the authoritative source and nothing here reads those TFs.
#
# Since the robot's `world_joint` is identity, world == fr3_link0, so these poses
# are also the ground-truth `base -> camera` transforms a hand-eye solve should
# recover.
#
# fx/fy are deliberately different: the SDF asks for an 80 x 51 deg FOV on a
# 640x480 image.  Real intrinsics are read from /camera_info at capture time and
# override whatever is written here.
cameras:
  femto_bolt:
    body_xyz: [0.90, 0.00, 0.70]
    body_rpy: [0.0, 0.785398, 3.141593]
    width: 640
    height: 480
    fx: 381.36
    fy: 501.19
    cx: 320.0
    cy: 240.0
    image_topic: /femto_bolt/color/image_raw
    camera_info_topic: /femto_bolt/color/camera_info

  femto_mega:
    body_xyz: [0.35, 1.05, 0.86]
    body_rpy: [0.0, 0.785398, -1.892547]
    width: 640
    height: 480
    fx: 381.36
    fy: 501.19
    cx: 320.0
    cy: 240.0
    image_topic: /femto_mega/color/image_raw
    camera_info_topic: /femto_mega/color/camera_info
