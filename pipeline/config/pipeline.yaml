# Pipeline settings.
#
# `pipeline new` copies this file into the new session as <session>/config.yaml
# and every later command reads THAT copy, so a session always records the
# settings it was produced with. Edit this file to change the defaults for new
# sessions; edit <session>/config.yaml to change one session.
#
# The workspace is the folder containing pipeline/ (found automatically).
# Relative paths below are relative to the workspace; ~ is expanded.

paths:
  sessions: sessions                         # must be inside the workspace
  # pose-refinement checkout with its .venv; default: next to the workspace.
  # The environment variable PIPELINE_POSE_REFINEMENT overrides this.
  pose_refinement: ../pose-refinement

docker:
  container: franka_ros                      # see docker/compose.yaml
  workspace: /franka_ws

robot:
  ip: 192.168.1.1
  # Frames, trajectory action and motion limits used by every capture tool.
  config: src/panda_calibration/config/calibration_hardware.yaml
  # Probe tool: pen-tip offset, approach height, descent limits.
  manipulation_config: src/panda_calibration/config/board_manipulation.yaml

holes: pipeline/config/holes.yaml
# Where each peg sits in the printed V-block fingers (franka_fr3_fingers v2);
# check/probe place the held peg, of the hole's shape, on the hole.
grasps: pipeline/config/grasps.yaml

# ---------------------------------------------------------------- eye in hand
# Azure Kinect rigidly mounted on the wrist housing (panda_link6, NOT joint 7).
# The board itself is the calibration target. Launch the camera with
# `roslaunch panda_calibration azure_4k.launch`.
eye_in_hand:
  camera: azure
  namespace: /azure_camera
  cameras_config: src/panda_calibration/config/cameras_azure.yaml
  # Rough T_link6_camera used to plan the calibration views (from the
  # AprilTag eye-in-hand solve of 2026-10-12 on the FR3; link6 is the same
  # frame on the Panda, so it holds if the camera bracket is mounted the same
  # way). Needs to be within ~1 cm.
  prior_handeye: pipeline/config/azure_prior_handeye.json
  look_pose: pipeline/config/azure_look_pose.yaml
  speed_scale: 0.3
  # Multiplies the capture tool's wait for a fresh frame (10 s) and its motion
  # timeouts; >1 tolerates a camera stream that stalls for a few seconds.
  timeout_scale: 3.0
  max_mad_px: 1.0            # reject board fits with a worse median rim residual
  # Calibrated outside the pipeline on 2026-11-19. `calibrate` keeps these fixed;
  # `calibrate --fit-intrinsics` / `--fit-joint-offsets` estimate them from the board
  # views instead (the old behaviour). Sessions copy them into their config.yaml.
  base_calibration:
    # Azure colour camera, AprilGrid (pipeline/tools/calibrate_azure_intrinsics.py):
    # fx fy cx cy refined, distortion kept at factory, 0.78 px RMS over 38 views.
    intrinsics_source: camera_calibration/azure_2026-11-19_114622/intrinsics.json
    intrinsics:
      fx: 1848.9176873870458
      fy: 1850.2389730721593
      cx: 1921.5632329184084
      cy: 1098.5255429628123
      k1: 0.32419127225875854
      k2: -2.520479679107666
      p1: 0.00035915308399125934
      p2: -0.00024095129629131407
      k3: 1.5407172441482544
      k4: 0.20744043588638306
      k5: -2.3417866230010986
      k6: 1.462856650352478
    # Joint encoder offsets, true angle = reading + offset (pipeline/tools/joint_offsets:
    # AprilGrid views + pen touches). J6 is uncertain (+-4 mrad); J1 and J7 are not observable.
    joint_offsets_source: kinematic_calibration/2026-11-19_140123/joint_offsets.json
    joint_offsets_rad:
      panda_joint1: 0.0
      panda_joint2: -0.002435263123034892
      panda_joint3: 0.004534366003008772
      panda_joint4: -0.0036185904484644766
      panda_joint5: 0.007162572564426816
      panda_joint6: -0.008341526338093718
      panda_joint7: 0.0
  calibrate:
    views: 30
    # Extra views from the robot's side of the board (camera between the base and
    # the board, looking away from the robot), visited from READY before the
    # look pose: the views above all look back toward the base. 0 turns them off.
    robot_side_views: 4
    bundle_free: [fx, fy, cx, cy]     # refined by bundle adjustment, only with --fit-intrinsics
    # Chain error terms (quoted: YAML reads off as false), see eye_in_hand.chain_model.
    # "off" is fitted only with --fit-joint-offsets. scale and sag are off by default
    # (2026-11-19: intrinsics and joint offsets come from base_calibration); add them
    # back as "scale", "sag" to fit the camera distance scale and the mount sag.
    model: ["off"]
  locate:
    views: 8
    max_view_spread_mm: 1.5           # views disagreeing more than this are dropped
  plan:                               # view generation, see eye_in_hand.plan_views
    min_dist: 0.40
    max_dist: 0.62
    max_tilt_deg: 35.0
    max_roll_deg: 45.0                # camera roll about its axis, around the look pose roll
    clearance: 0.125                  # link origins above the board top, m
    limit_margin: 0.15                # rad from each joint limit
    image_margin: 120.0               # px
    max_step_deg: 45.0
    box_deg: 35.0                     # confine joints 1-6 to +-this around the look pose (needed: wider gives unreachable views)
    seed: 20261012

# ----------------------------------------------------------------- stationary
# Femto Mega + Femto Bolt fixed in the cell, ArUco tag on the gripper. Launch
# the cameras with `roslaunch panda_calibration orbbec_4k.launch`.
stationary:
  cameras:                    # name: topic namespace
    mega: /mega_camera
    bolt: /wrist_camera
  reference_camera: mega
  cameras_config: src/panda_calibration/config/cameras_mega_bolt.yaml
  calibration_poses: pipeline/config/stationary_calibration_poses.txt
  speed_scale: 0.2
  # Accepted board-rig calibration (pose-refinement calibrate_stationary_rig.py),
  # used with two cameras for its validated per-camera rim-bias terms.
  # null fits without it.
  rig_calibration: null
