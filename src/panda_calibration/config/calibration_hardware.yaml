# Configuration for the Franka Panda (FER) calibration pose driver.

robot:
  base_link: panda_link0    # Match the live MoveIt planning frame.
  tip_link: panda_hand_tcp
  joint_names: [panda_joint1, panda_joint2, panda_joint3, panda_joint4,
                panda_joint5, panda_joint6, panda_joint7]
  # Used when /robot_description is not available (offline solves). Same
  # kinematics as the live description loaded by franka_control.launch.
  xacro: package://franka_description/robots/panda/panda.urdf.xacro
  xacro_mappings:
    hand: 'true'
    arm_id: panda
  # MoveIt IK (panda_moveit_config): the group whose tip is tip_link. Without
  # move_group running, the tools fall back to the local numeric IK.
  move_group: panda_manipulator
  ik_service: /compute_ik

tag:
  family: 4x4_50
  id: 0
  # Side length of the BLACK SQUARE only, in metres. Not the white border.
  size: 0.106
  # Pose of the tag frame relative to panda_hand_tcp.
  #
  # Derived from "in the default (ready) configuration the gripper points along
  # world -Z and the tag faces world +X": at `ready`, panda_hand_tcp has
  # tcp-X -> world +X and tcp-Z -> world -Z, so the tag's outward normal (+Z of
  # the tag frame) is panda_hand_tcp +X.  rpy (-pi/2, 0, -pi/2) gives
  # tag-X -> tcp -Y, tag-Y -> tcp -Z, tag-Z -> tcp +X.
  #
  # Measure this on the real plate and update; the calibration itself does not
  # depend on it being exact, but pose generation and visibility do.
  #
  # The X standoff matters: with the plate flush against the hand (0.05) Gazebo
  # showed the gripper clipping the black square at oblique angles even from
  # 23 deg off-normal.  0.12 clears the fingers.  MEASURE THIS ON THE REAL PLATE.
  mount_xyz: [0.12, 0.0, -0.05]
  mount_rpy: [-1.5707963, 0.0, -1.5707963]

# The robot occludes its own tag.  Each link is approximated as a capsule
# between consecutive link origins, and a pose is rejected if the line of sight
# from a camera to any tag corner passes through one.  Gazebo showed both
# failure modes this catches: the gripper clipping the black square, and the
# forearm lying straight across it -- in both cases from views the pure
# projection maths called "comfortably in frame, 20 deg off-normal".
# Set `occluders:` to null to disable the check entirely.
occluders:
  radius: 0.065
  link_radius:
    panda_link0: 0.09
    panda_link1: 0.07
    panda_link2: 0.07
    panda_link3: 0.07
    panda_link4: 0.07
    panda_link7: 0.05
    panda_hand: 0.07

visibility:
  border_px: 30.0           # keep corners this far inside the image
  min_apparent_px: 35.0     # mean edge length of the black square, in pixels
  max_incidence_deg: 65.0   # angle between tag normal and the line to the camera
  min_range: 0.40
  max_range: 1.60

pose_generation:
  count: 15
  seed: 20260829
  # Sampling box for the tag centre, chosen for the configured camera frusta
  # while staying comfortably inside the Panda workspace. This same hardware
  # config works with either one camera or the dual-camera YAML.
  centre: [0.40, 0.35, 0.45]
  extents: [0.16, 0.22, 0.16]
  # The tag normal is aimed at a weighted blend of the configured camera
  # centres. With one camera all weights produce that camera's centre.
  aim_weights: [0.0, 0.25, 0.5, 0.75, 1.0]
  max_tilt_deg: 25.0        # random tilt away from the aim direction
  roll_step_deg: 30.0       # in-plane roll sweep; this is what conditions AX=XB
  max_candidates: 4000       # sampling attempts before giving up
  pool_size: 200             # feasible candidates to collect before selecting
  min_poses_per_camera: 8
  # Reject a candidate whose base->tcp rotation is closer than this to an
  # already-selected pose. Rotation diversity is the dominant accuracy driver.
  min_rotation_separation_deg: 12.0
  feasibility:
    limit_margin: 0.1
    min_link_height: 0.05
    base_radius: 0.20
    base_height: 0.35

motion:
  # One single-point FollowJointTrajectory goal per move to franka_control's
  # position_joint_trajectory_controller (libfranka joint position interface,
  # franka_control's rate limiter on). Zero end velocity and acceleration make
  # the controller interpolate a quintic, so the command has no acceleration
  # jump for libfranka's discontinuity reflexes. robot.launch starts it.
  action_type: follow_joint_trajectory
  controller_action: /position_joint_trajectory_controller/follow_joint_trajectory
  # The aggregate /joint_states topic is published at 30 Hz by
  # joint_state_publisher. franka_state_controller publishes the measured arm
  # joints at its publish_rate (robot.launch sets 250 Hz) for the settle and
  # image-bracketing checks.
  measured_joint_state_topic: /franka_state_controller/joint_states
  # franka_msgs/FrankaState: O_T_EE is the robot's measured pose of the Desk
  # end effector (Franka Hand -> identical to panda_hand_tcp), rather than
  # nominal-URDF FK. The tools verify that once at startup. Its header has no
  # frame_id, so the frame is stated here.
  measured_tcp_pose_topic: /franka_state_controller/franka_states
  measured_tcp_pose_frame: panda_link0
  max_joint_speed: 0.4      # rad/s, before --speed-scale
  min_duration: 2.0         # s, floor on any point-to-point move
  goal_time_tolerance: 0.5  # s the controller may overrun the trajectory end
  settle_motion: 0.002      # rad; max joint movement across the settle window
                            # (position-based: reported velocities are not
                            # trusted, e.g. a constant offset in simulation)
  max_position_error: 0.06  # rad; legacy joint-space settling gate
  # Final Cartesian target tolerance checked against the measured Franka TCP.
  # 0.2 mm: at 0.1 mm (the Panda's rated repeatability) the corrections stalled
  # at ~0.12 mm and aborted descents (2026-11-04).
  max_cartesian_position_error_m: 0.0002
  # atan2(0.0001, 0.125): 0.1 mm lateral error at the user's 125 mm tool length.
  max_cartesian_rotation_error_rad: 0.000799999829333
  # The arm can settle with a small repeatable load/model residual. Retry only
  # residuals inside the window below; a larger residual is treated as a wrong
  # target/TCP and aborts instead of being silently accepted.
  cartesian_correction_attempts: 3
  # Observed after the first move (the arm settles short under the wrist load):
  # FR3 ~0.9 mm / 0.12 deg; Panda 1.2 mm / 0.23 deg at the probe approach pose
  # (2026-11-02, camera not in Desk's load model). About twice the Panda value.
  cartesian_correction_window_m: 0.003
  cartesian_correction_window_rad: 0.008
  settle_hold: 0.5          # s the settle condition must hold
  goal_timeout_margin: 10.0 # s added on top of the trajectory duration

capture:
  discard_frames: 3         # additional valid frames dropped after the timestamp gate
  # Camera callbacks can be delayed after exposure. Require both a callback after
  # settling and an image header timestamp after the settling state timestamp.
  require_post_settle_timestamp: true
  # Do not advance to another pose unless every configured camera produced a
  # timestamp-valid image with a measured-joint bracket.
  require_all_cameras: true
  frame_timeout: 10.0       # s to wait for each frame
  detect: true              # run cv2.aruco as a visibility QA check
